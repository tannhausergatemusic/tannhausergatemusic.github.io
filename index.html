<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#08090d">
    <meta name="description" content="Listen to Tannhäuser Gate on Spotify, Apple Music, and YouTube Music.">
    <title>Tannhäuser Gate</title>
    <link rel="canonical" href="https://tannhausergate.music/">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="icon" href="favicon-32x32.png" type="image/png" sizes="32x32">
    <link rel="icon" href="favicon-16x16.png" type="image/png" sizes="16x16">
    <link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180">
    <link rel="preconnect" href="https://open.spotify.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Space+Grotesk:wght@400;500&display=swap">
    <style>
      :root {
        color-scheme: dark;
        font-family: "Space Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 16px;
        line-height: 1.5;
        background: #08090d;
        color: #e4cff8;
        --pink: #ff3d8f;
        --pink-soft: #ff5c9f;
        --muted: #b9aed0;
        --line: #3a3050;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-block-size: 100vh;
        min-block-size: 100svh;
        margin: 0;
        padding: clamp(40px, 8vh, 72px) clamp(20px, 4vw, 32px);
        background: #08090d;
      }

      main {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 48px 64px;
        inline-size: 100%;
        max-inline-size: 1120px;
      }

      .intro {
        display: flex;
        flex: 1 1 420px;
        flex-direction: column;
        gap: 28px;
        min-inline-size: 0;
      }

      h1 {
        margin: 0;
        font-family: Syncopate, "Space Grotesk", sans-serif;
        font-size: clamp(26px, 7.4vw, 44px);
        font-weight: 700;
        line-height: 1.2;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #fff;
        text-shadow: 0 0 22px rgb(255 61 143 / 0.6);
      }

      .rule {
        inline-size: 96px;
        block-size: 2px;
        margin-block: 18px;
        background: var(--pink);
        box-shadow: 0 0 14px var(--pink);
      }

      .tagline {
        margin: 0;
        font-size: 18px;
        color: var(--muted);
      }

      h2 {
        margin: 0 0 12px;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
      }

      a {
        color: inherit;
        transition: color 0.15s, border-color 0.15s, box-shadow 0.15s;
      }

      a:focus-visible {
        outline: 2px solid #fff;
        outline-offset: 4px;
      }

      .listen a {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        min-block-size: 52px;
        padding: 0 22px;
        border: 1px solid var(--pink);
        border-radius: 999px;
        box-shadow: 0 0 16px rgb(255 61 143 / 0.28);
        font-size: 16px;
        font-weight: 500;
        color: #fff;
        text-decoration: none;
        white-space: nowrap;
      }

      .listen a span {
        color: var(--pink-soft);
      }

      .listen a:hover {
        box-shadow: 0 0 24px rgb(255 61 143 / 0.55);
      }

      .follow .icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        inline-size: 48px;
        block-size: 48px;
        border: 1px solid var(--line);
        border-radius: 999px;
      }

      .follow .icon:hover {
        border-color: var(--pink);
        color: #fff;
      }

      .follow .contact {
        display: inline-flex;
        align-items: center;
        min-block-size: 48px;
        margin-inline-start: 12px;
        font-size: 15px;
        color: var(--muted);
        text-decoration-thickness: 1px;
        text-underline-offset: 0.35em;
      }

      .follow .contact:hover {
        color: #fff;
      }

      svg {
        inline-size: 22px;
        block-size: 22px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .player {
        flex: 1 1 460px;
        min-inline-size: 0;
      }

      iframe {
        display: block;
        inline-size: 100%;
        block-size: 500px;
        block-size: clamp(352px, calc(100svh - 12rem), 500px);
        border: 0;
        border-radius: 12px;
        background: #121212;
        box-shadow: 0 0 60px rgb(255 61 143 / 0.12);
      }

      @media (prefers-reduced-motion: reduce) {
        a {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="intro">
        <header>
          <h1>Tannhäuser<br>Gate</h1>
          <div class="rule" aria-hidden="true"></div>
          <p class="tagline">Somewhere between the neon and the rain</p>
        </header>

        <nav class="listen" aria-label="Listen">
          <h2>Listen</h2>
          <div class="row">
            <a href="https://open.spotify.com/artist/16oRxqB7cGZgjQVOKB4mok" target="_blank" rel="noopener noreferrer">Spotify <span aria-hidden="true">↗</span></a>
            <a href="https://music.apple.com/no/artist/tannh%C3%A4user-gate/1731564415" target="_blank" rel="noopener noreferrer">Apple Music <span aria-hidden="true">↗</span></a>
            <a href="https://music.youtube.com/channel/UCVZxKz-_9kj9h4zQtG7lVXg" target="_blank" rel="noopener noreferrer">YouTube Music <span aria-hidden="true">↗</span></a>
          </div>
        </nav>

        <nav class="follow row" aria-label="Follow and contact">
          <a class="icon" href="https://www.instagram.com/tannhausergate.music/" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17" cy="7" r="0.6" fill="currentColor"/></svg>
          </a>
          <a class="icon" href="https://www.tiktok.com/@tannhausergate.music" target="_blank" rel="noopener noreferrer" aria-label="TikTok">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4v10.5a3.5 3.5 0 1 1-3.5-3.5"/><path d="M14 4c.4 2.4 2 4 4.5 4.3"/></svg>
          </a>
          <a class="icon" href="https://www.youtube.com/@TannhauserGateMusic" target="_blank" rel="noopener noreferrer" aria-label="YouTube">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="5.5" width="19" height="13" rx="4"/><path d="M10.5 9.5l4.5 2.5-4.5 2.5z"/></svg>
          </a>
          <a class="contact" href="mailto:band@tannhausergate.music">Contact</a>
        </nav>
      </div>

      <div class="player">
        <iframe
          src="https://open.spotify.com/embed/artist/16oRxqB7cGZgjQVOKB4mok?theme=0"
          title="Tannhäuser Gate — top tracks on Spotify"
          width="100%"
          height="500"
          allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
          allowfullscreen
          loading="eager"
        ></iframe>
      </div>
    </main>
  </body>
</html>
