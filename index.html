<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#08090d">
    <meta name="description" content="Listen to Tannhäuser Gate on Spotify, Apple Music, and YouTube Music.">
    <title>Tannhäuser Gate</title>
    <link rel="canonical" href="https://xn--tannhusergate-ffb.com/">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="icon" href="favicon-32x32.png" type="image/png" sizes="32x32">
    <link rel="icon" href="favicon-16x16.png" type="image/png" sizes="16x16">
    <link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180">
    <link rel="preconnect" href="https://open.spotify.com">
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 16px;
        line-height: 1.5;
        background: #08090d;
        color: #e4cff8;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        isolation: isolate;
        display: flex;
        flex-direction: column;
        min-block-size: 100vh;
        min-block-size: 100svh;
        margin: 0;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -1;
        background: #08090d;
        pointer-events: none;
      }

      main {
        display: flex;
        flex: 1 0 auto;
        align-items: center;
        justify-content: center;
        min-inline-size: 0;
        padding: clamp(24px, 8vh, 80px) 24px;
      }

      iframe {
        display: block;
        inline-size: min(100%, 45rem);
        block-size: 500px;
        block-size: clamp(352px, calc(100svh - 12rem), 500px);
        border: 0;
        border-radius: 12px;
        background: #121212;
      }

      footer {
        padding: 16px 24px clamp(24px, 6vh, 64px);
      }

      nav {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 16px clamp(24px, 4vw, 52px);
        margin-inline: auto;
        max-inline-size: 45rem;
      }

      a {
        display: inline-block;
        padding-block: 8px;
        color: inherit;
        text-decoration-thickness: 1px;
        text-underline-offset: 0.35em;
        white-space: nowrap;
      }

      a:hover {
        color: #fff;
      }

      a:focus-visible {
        outline: 2px solid currentColor;
        outline-offset: 5px;
        border-radius: 2px;
      }

      @media (max-width: 480px) {
        main {
          padding: 24px 20px;
        }

        footer {
          padding: 16px 20px 28px;
        }

        nav {
          display: grid;
          grid-template-columns: repeat(2, max-content);
          gap: 8px 32px;
        }
      }
    </style>
  </head>
  <body>
    <main aria-label="Music">
      <iframe
        src="https://open.spotify.com/embed/artist/16oRxqB7cGZgjQVOKB4mok?theme=0"
        title="Tannhäuser Gate — top tracks on Spotify"
        width="100%"
        height="500"
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
        allowfullscreen
        loading="eager"
      ></iframe>
    </main>
    <footer>
      <nav aria-label="Music platforms and contact">
        <a href="https://open.spotify.com/artist/16oRxqB7cGZgjQVOKB4mok" target="_blank" rel="noopener noreferrer">Spotify</a>
        <a href="https://music.apple.com/no/artist/tannh%C3%A4user-gate/1731564415" target="_blank" rel="noopener noreferrer">Apple Music</a>
        <a href="https://music.youtube.com/channel/UCVZxKz-_9kj9h4zQtG7lVXg" target="_blank" rel="noopener noreferrer">YouTube Music</a>
        <a href="mailto:band@tannhäusergate.com">Contact</a>
      </nav>
    </footer>
  </body>
</html>
